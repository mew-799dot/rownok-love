<!DOCTYPE html>
<html>
<head>
  <title>Love Page 💙</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ffdde1,#ee9ca7);
      font-family:Arial;
      color:white;
      text-align:center;
    }

    .box{
      padding:40px;
      background:rgba(255,255,255,0.2);
      border-radius:20px;
      backdrop-filter:blur(10px);
    }

    h1{
      font-size:30px;
    }

    .heart{
      font-size:50px;
      animation:beat 1s infinite;
    }

    @keyframes beat{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.3)}
    }
  </style>
</head>

<body>

<audio autoplay loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="box">
  <div class="heart">💙</div>
  <h1>Rownok ❤️ Someone</h1>
  <p>This is a simple love page 💖</p>
</div>

</body>
</html>
